name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome pytest
      - run: python -m pytest -q

  apk:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev autopoint gettext

      - name: Instalar Buildozer
        run: |
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools "cython==0.29.34"

      # Guarda el SDK/NDK y lo ya compilado: la 1.ª vez tarda ~30 min, luego mucho menos.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Versión automática: 0.3.<número de compilación>. versionCode siempre creciente para que
      # Android acepte cada APK como actualización del anterior.
      - name: Versión
        run: |
          VERSION="0.3.${{ github.run_number }}"
          CODE=$((300 + ${{ github.run_number }}))
          sed -i "s/^version = .*/version = ${VERSION}/" buildozer.spec
          grep -q "^android.numeric_version" buildozer.spec \
            && sed -i "s/^android.numeric_version = .*/android.numeric_version = ${CODE}/" buildozer.spec \
            || sed -i "/^version = /a android.numeric_version = ${CODE}" buildozer.spec
          printf 'VERSION = "%s"\nBUILD = %s\n' "$VERSION" "$CODE" > onuchanger/version.py
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión $VERSION (versionCode $CODE)"

      # Firma SIEMPRE con la misma llave (llave y contraseña guardadas como secretos del
      # repositorio, no en el código): así cada versión se instala encima de la anterior sin desinstalar.
      - name: Llave de firma fija
        env:
          KEYSTORE_B64: ${{ secrets.MAXSONU_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.MAXSONU_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Faltan los secretos MAXSONU_KEYSTORE_B64 y/o MAXSONU_KEYSTORE_PASS (llave de firma). Sin ellos cada APK tendría otra firma."
            exit 1
          fi
          mkdir -p ~/.android
          # Tolera espacios/saltos de línea que se cuelan al copiar y pegar el texto.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > ~/.android/debug.keystore \
            || { echo "::error::MAXSONU_KEYSTORE_B64 no es el contenido de maxsonu.keystore.b64 (texto base64)."; exit 1; }
          PASS=$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n')
          keytool -list -keystore ~/.android/debug.keystore -storepass "$PASS" >/dev/null 2>&1 \
            || { echo "::error::La llave no abre con MAXSONU_KEYSTORE_PASS (contraseña incorrecta o llave equivocada)."; exit 1; }
          # La firma de depuración de Gradle solo acepta la contraseña "android": la copia
          # temporal de este servidor se convierte a esa contraseña (la llave no cambia).
          keytool -storepasswd -keystore ~/.android/debug.keystore -storepass "$PASS" -new android
          FP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA256:" | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          [ "$FP" = "ed809c21d661362b73c2cf8432abeb1b9333e7375851d26bdac743b3f17890a0" ] \
            || { echo "::error::La llave del secreto no es la de MaxsFibra (huella $FP)."; exit 1; }
          echo "Llave de MaxsFibra cargada (huella OK)"

      - name: Compilar APK (debug)
        run: yes | buildozer android debug

      # Re-firma con la llave fija (por si Buildozer usó otra) y comprueba la huella.
      - name: Firmar con la llave fija
        run: |
          KS=~/.android/debug.keystore
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -1)
          for apk in bin/*.apk; do
            "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey "$apk"
          done
          # Huella pública de la llave de MaxsFibra (no es secreta).
          EXPECTED="ed809c21d661362b73c2cf8432abeb1b9333e7375851d26bdac743b3f17890a0"
          "$BT/apksigner" verify --print-certs bin/*.apk | grep -i "SHA-256"
          "$BT/apksigner" verify --print-certs bin/*.apk | grep -qi "$EXPECTED" \
            || { echo "::error::El APK no quedó firmado con la llave de MaxsFibra"; exit 1; }
          echo "FIRMA OK (llave fija de MaxsFibra)"
          mkdir -p out
          cp bin/*.apk "out/MaxsFibra-v${VERSION}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MaxsFibra-v${{ env.VERSION }}
          path: out/*.apk
          if-no-files-found: error
